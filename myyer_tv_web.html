<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myyer TV — Channel Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Myriad Pro','Gotham',Arial,Helvetica,sans-serif;background:#101114;color:#f2f3f5}
header{position:sticky;top:0;z-index:10;background:#181a20;border-bottom:1px solid #2b2e36;padding:14px 18px}
h1{margin:0 0 10px;font-size:22px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input,select{background:#242730;color:white;border:1px solid #3a3e49;border-radius:8px;padding:10px 12px;outline:none}
input{min-width:260px;flex:1}
main{display:block;padding:16px;max-width:1500px;margin:auto}
.player{background:#000;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #0008}
video{width:100%;aspect-ratio:16/9;display:block;background:#000;max-height:70vh}
.now{padding:12px 14px;background:#191b21}
.now b{font-size:18px}
.status{font-size:13px;color:#aeb3bf;margin-top:5px}
.list{background:#181a20;border-radius:12px;padding:16px;margin-top:16px}
.group{margin:8px 0 12px}
.group-title{font-weight:bold;color:#9da5ff;padding:8px 5px;margin-bottom:8px;background:#181a20;border-bottom:1px solid #30343e}
.group{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.group-title{grid-column:1/-1}.channel{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#22252d;color:white;border:1px solid #30343e;border-radius:9px;padding:8px;margin:0;cursor:pointer;min-height:52px}
.channel:hover{background:#2b2f39}
.channel.active{outline:2px solid #7c83ff;background:#30344a}
.logo{width:42px;height:30px;object-fit:contain;background:#111;border-radius:5px;flex:none}
.channel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:20px;color:#aaa;text-align:center}
@media(max-width:900px){.group{grid-template-columns:repeat(2,minmax(0,1fr))}.list{margin-top:12px}}@media(max-width:520px){.group{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>📺 Myyer TV — 266 kênh</h1>
  <div class="controls">
    <input id="search" placeholder="🔎 Tìm kênh..." autocomplete="off">
    <select id="group"><option value="">Tất cả nhóm</option></select>
  </div>
</header>
<main>
  <section>
    <div class="player">
      <video id="video" controls playsinline></video>
      <div class="now">
        <b id="current">Chưa chọn kênh</b>
        <div class="status" id="status">Bấm một nút kênh ở bên phải để phát.</div>
      </div>
    </div>
  </section>
  <section class="list"><div id="count" class="status" style="margin:0 0 10px">Danh sách kênh</div><div id="list"></div></section>
</main>

const video = document.getElementById('video');
const list = document.getElementById('list');
const search = document.getElementById('search');
const group = document.getElementById('group');
const current = document.getElementById('current');
const status = document.getElementById('status');
const count = document.getElementById('count');
let hls = null;

const groups = [...new Set(channels.map(c => c.group))];
for (const g of groups) {
  const o = document.createElement('option'); o.value = g; o.textContent = g; group.appendChild(o);
}

function render() {
  const q = search.value.toLowerCase().trim();
  const g = group.value;
  list.innerHTML = '';
  const filtered = channels.filter(c =>
    (!q || c.name.toLowerCase().includes(q)) &&
    (!g || c.group === g)
  );
  count.textContent = `Hiển thị ${filtered.length} / ${channels.length} kênh`;
  if (!filtered.length) { list.innerHTML = '<div class="empty">Không tìm thấy kênh.</div>'; return; }
  const byGroup = {};
  for (const c of filtered) (byGroup[c.group] ??= []).push(c);
  for (const [grp, arr] of Object.entries(byGroup)) {
    const box = document.createElement('div'); box.className = 'group';
    const title = document.createElement('div'); title.className = 'group-title'; title.textContent = grp;
    box.appendChild(title);
    for (const c of arr) {
      const b = document.createElement('button'); b.className='channel'; b.dataset.url=c.url;
      b.innerHTML = (c.logo ? `<img class="logo" src="${c.logo}" loading="lazy" onerror="this.style.visibility='hidden'">` : '<div class="logo"></div>') +
                     `<span>${escapeHtml(c.name)}</span>`;
      b.onclick = () => play(c, b);
      box.appendChild(b);
    }
    list.appendChild(box);
  }
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function play(c, btn) {
  document.querySelectorAll('.channel.active').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  current.textContent = c.name;
  status.textContent = 'Đang kết nối...';
  if (hls) { hls.destroy(); hls=null; }
  video.pause(); video.removeAttribute('src'); video.load();

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({enableWorker:true});
    hls.loadSource(c.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      status.textContent = 'Đã tải luồng — bấm ▶ nếu trình duyệt chưa tự phát.';
      video.play().catch(()=>{});
    });
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) status.textContent = 'Không phát được luồng này. Có thể link đã hết hạn hoặc máy chủ chặn trình duyệt.';
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = c.url;
    video.addEventListener('loadedmetadata', () => {
      status.textContent = 'Đã tải luồng.';
      video.play().catch(()=>{});
    }, {once:true});
  } else {
    status.textContent = 'Trình duyệt không hỗ trợ HLS.';
  }
}
search.addEventListener('input', render);
group.addEventListener('change', render);
render();
</script>
